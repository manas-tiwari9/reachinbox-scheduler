services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: reachinbox-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false          # Set in Render dashboard
      - key: DIRECT_URL
        sync: false          # Set in Render dashboard
      - key: REDIS_URL
        sync: false          # Set in Render dashboard (Upstash)
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false          # https://reachinbox-backend.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        sync: false          # https://your-app.vercel.app
      - key: ELASTICSEARCH_URL
        value: http://localhost:9200   # disabled in prod
      - key: ELASTICSEARCH_INDEX
        value: email_jobs
      - key: WORKER_CONCURRENCY
        value: 2
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 100
      - key: EMAIL_DELAY_MS
        value: 2000

  # ── BullMQ Worker ────────────────────────────────────────────────────────
  - type: worker
    name: reachinbox-worker
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/queues/email.worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: 2
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 100
      - key: EMAIL_DELAY_MS
        value: 2000
