version: '3.9'

services:
  # ─── Redis ───────────────────────────────────────────────
  # BullMQ uses Redis to persist delayed jobs. Even after a
  # server restart, scheduled jobs remain and fire on time.
  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # AOF persistence
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── MySQL 8 ─────────────────────────────────────────────
  # Stores users, email jobs, slack tokens.
  mysql:
    image: mysql:8.0
    container_name: reachinbox_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: reachinbox
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Elasticsearch 8 ─────────────────────────────────────
  # Full-text search index for emails (subject, body, recipient).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: reachinbox_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # disabled for dev simplicity
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -q "\"status\":\"green\"\|\"status\":\"yellow\""']
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  redis_data:
  mysql_data:
  es_data:
